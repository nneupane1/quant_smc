models:

  # =======================================================
  # Specialist models
  # =======================================================

  liq_flow:
    algorithm: "lightgbm"
    horizon_bars: 12
    calibrator: "auto"
    hpo_trials: 50
    cv_splits: 4
    class_weight: "balanced"
    features:
      group: ["smc", "liquidity", "ema", "volatility", "regime", "session"]
    hpo_space:
      n_estimators: [200, 600]
      num_leaves: [31, 255]
      max_depth: [3, 12]
      learning_rate: [0.001, 0.15]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
      reg_alpha: [0.0, 10.0]
      reg_lambda: [0.0, 10.0]

  bos_cont:
    algorithm: "lightgbm"
    horizon_bars: 48
    calibrator: "auto"
    hpo_trials: 50
    cv_splits: 4
    class_weight: "balanced"
    features:
      group: ["smc", "volatility", "ema", "regime", "session"]
    hpo_space:
      n_estimators: [200, 700]
      num_leaves: [31, 255]
      max_depth: [3, 12]
      learning_rate: [0.001, 0.15]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
      reg_alpha: [0.0, 10.0]
      reg_lambda: [0.0, 10.0]

  momo:
    algorithm: "lightgbm"
    horizon_bars: 8
    calibrator: "auto"
    hpo_trials: 40
    cv_splits: 4
    features:
      group: ["smc", "ema", "volatility", "liquidity", "regime", "session"]
    hpo_space:
      n_estimators: [100, 400]
      num_leaves: [15, 200]
      max_depth: [2, 10]
      learning_rate: [0.001, 0.15]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  flow_1h:
    algorithm: "lightgbm"
    horizon_bars: 12
    calibrator: "auto"
    hpo_trials: 40
    cv_splits: 4
    class_weight: "balanced"
    features:
      contains_any: ["_1h", "zone_score_6h", "compression_6h", "structural_bias_6h", "p_regime_", "toxicity_12h", "trend_persist", "compression_12h", "vol_pct", "session_"]
      exact: ["session", "session_weight", "regime_state", "atr", "realized_vol", "vol_zscore", "range_pct"]
      allowed_timeframes: ["1h", "6h", "12h"]
      allow_unsuffixed: false
      unsuffixed_exact: ["session", "session_weight", "regime_state", "regime_state_id", "atr", "atr_15m", "realized_vol", "vol_zscore", "range_pct", "vol_pct", "trend_persist"]
      unsuffixed_prefixes: ["p_regime_"]
      timeframe_prefixes:
        "6h": ["zone_", "compression_", "bias", "structural_bias", "demand_", "supply_"]
        "12h": ["regime_", "p_regime_", "toxicity_", "compression_", "vol_pct"]
    hpo_space:
      n_estimators: [150, 500]
      num_leaves: [15, 255]
      max_depth: [3, 10]
      learning_rate: [0.001, 0.12]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  eop:
    algorithm: "xgboost"
    horizon_bars: 96
    calibrator: "isotonic"
    hpo_trials: 40
    cv_splits: 3
    features:
      group: ["smc", "ema", "volatility", "regime", "session"]
    hpo_space:
      n_estimators: [200, 800]
      max_depth: [3, 12]
      learning_rate: [0.001, 0.15]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  edp:
    algorithm: "xgboost"
    horizon_bars: 96
    calibrator: "isotonic"
    hpo_trials: 40
    cv_splits: 3
    features:
      group: ["smc", "volatility", "regime", "session"]
    hpo_space:
      n_estimators: [200, 800]
      max_depth: [3, 12]
      learning_rate: [0.001, 0.15]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  regime_classifier:
    algorithm: "logistic"
    calibrator: "platt"
    hpo_trials: 20
    cv_splits: 3
    features:
      group: ["regime", "volatility", "ema"]
    hpo_space:
      C: [0.01, 10.0]

  # =======================================================
  # Meta-model (stacking specialist outputs)
  # =======================================================
  meta_model:
    algorithm: "logistic"
    challenger_enabled: true
    challenger_algorithms: ["lightgbm", "xgboost"]
    challenger_hpo_trials: 10
    calibrator: "platt"
    hpo_trials: 20
    cv_splits: 3
    specialist_inputs: ["liq_flow", "bos_cont", "flow_1h", "momo", "eop", "edp"]
    hpo_space:
      C: [0.01, 5.0]

  # =======================================================
  # Confluence model
  # =======================================================
  confluence_model:
    algorithm: "logistic"
    challenger_enabled: true
    challenger_algorithms: ["lightgbm", "xgboost"]
    challenger_hpo_trials: 10
    calibrator: "isotonic"
    hpo_trials: 20
    cv_splits: 3
    specialist_inputs: ["liq_flow", "bos_cont", "flow_1h", "momo", "eop", "edp"]
    hpo_space:
      C: [0.01, 4.0]

  # =======================================================
  # Hazard survival model (per-bin)
  # =======================================================
  hazard:
    algorithm: "logistic"
    challenger_enabled: true
    challenger_algorithms: ["lightgbm", "xgboost"]
    challenger_probe_bin: 12
    challenger_hpo_trials: 6
    horizon_bars: 48
    min_event_fraction: 0.01
    calibrate_bins: false
    features:
      group: ["smc", "ema", "volatility", "liquidity", "regime", "session"]
    hpo:
      enabled: true
      trials_per_bin: 10
    hpo_space:
      C: [0.01, 10.0]
      n_estimators: [150, 400]
      num_leaves: [15, 127]
      max_depth: [3, 10]
      learning_rate: [0.005, 0.12]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]
      reg_alpha: [0.0, 5.0]
      reg_lambda: [0.0, 5.0]

  # =======================================================
  # Quantile return forecaster (for MPC & CVaR)
  # =======================================================
  quantile_forecaster:
    algorithm: "lightgbm"
    quantiles: [0.05, 0.1, 0.5, 0.9, 0.95]
    hpo_trials: 40
    cv_splits: 4
    features:
      group: ["smc", "volatility", "ema", "regime"]
    hpo_space:
      n_estimators: [200, 600]
      num_leaves: [31, 255]
      max_depth: [3, 12]
      learning_rate: [0.001, 0.15]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

# =======================================================
# Training preprocessing policy (applied before all model fits)
# =======================================================
training_preprocessing:
  # Numeric missing values
  num_imputer: "median"
  # Categorical missing values
  cat_imputer: "most_frequent"
  # standard | robust | none
  scaler: "standard"
  # Tree models are usually scale-invariant; keep numeric scaling off for trees by default.
  scale_for_tree_models: false
  # Leak-safe winsorization on training folds
  outlier_clip: true
  clip_quantiles: [0.005, 0.995]
  feature_selection:
    enabled: true
    # Drop columns with too many missing values.
    max_missing_ratio: 0.35
    # Remove exact duplicate columns.
    drop_exact_duplicates: true
    # Pearson absolute correlation pruning threshold for numeric columns.
    correlation_threshold: 0.90
    # Always keep at least this many features after hygiene/filtering.
    min_features: 24
    # Optional supervised filter (classification targets only).
    use_mutual_info: true
    mutual_info_top_k: 120
    mutual_info_random_state: 42
    # Target-specific dominance diagnostics on critical features.
    # This does not change training outputs; it only records warnings/metrics.
    dominance_audit:
      enabled: true
      min_rows: 4096
      sample_rows: 20000
      random_state: 42
      min_top_drop: 0.01
      dominance_share_warn: 0.55
      monitor_features_by_model:
        flow_1h: ["flow_age_bars_1h", "flow_ok_1h", "flow_signal_1h"]

training_logging:
  heartbeat_seconds: 60

# =======================================================
# Deep learning benchmark (TCN specialist classifiers)
# =======================================================
tcn_training:
  default:
    random_seed: 42
    hpo_trials: 20
    hpo_resume: true
    hpo_storage: null
    hpo_study_name: null
    hpo_pruner_warmup_steps: 1
    hpo_gc_after_trial: true
    hpo_log_every_n_trials: 1
    hpo_adaptive_stop: true
    hpo_adaptive_min_completed_trials: 10
    hpo_adaptive_no_improve_trials: 6
    hpo_adaptive_min_delta: 0.001
    fold_heartbeat: true
    epoch_heartbeat_seconds: 120
    progress_snapshot_filename: "hpo_progress.json"
    progress_events_filename: "hpo_progress.ndjson"
    cv_splits: 4
    embargo_bars: 2
    feature_source: "tree_manifest"   # tree_manifest | auto
    calibrator: "auto"                # auto | platt | isotonic | empirical | none
    holdout_frac: 0.15
    acceptance:
      enabled: true
      holdout_frac: 0.10
      min_rows: 4096
      max_score_drop: 0.05
      min_score: null
      min_precision_at_threshold: 0.10
    stability:
      enabled: true
      seeds: [42, 52, 62]
      max_std: 0.02
      max_drop_vs_best: 0.04
    threshold_tuning:
      enabled: true
      metric: "f1"
      beta: 1.0
      min_precision: 0.10
      min_recall: 0.01
      default_threshold: 0.50
      max_candidates: 256
    feature_dominance_audit:
      enabled: true
      min_rows: 4096
      sample_rows: 20000
      random_state: 42
      min_top_drop: 0.01
      dominance_share_warn: 0.55
      monitor_features_by_target:
        flow_1h: ["flow_age_bars_1h", "flow_ok_1h", "flow_signal_1h"]
    device: "cpu"
    torch_num_threads: 1
    torch_num_interop_threads: 1
    mkldnn_enabled: false
    preprocessing:
      num_imputer: "median"
      cat_imputer: "most_frequent"
      scaler: "standard"
      outlier_clip: true
      clip_quantiles: [0.005, 0.995]
    hpo_space:
      lookback: [24, 96]
      levels: [1, 3]
      channels: [16, 64]
      kernel_size: [2, 5]
      dropout: [0.0, 0.35]
      lr: [0.0001, 0.003]
      weight_decay: [0.00000001, 0.001]
      batch_size_choices: [64, 128, 256]
      max_epochs: [8, 24]
      patience: [3, 7]
  overrides:
    momo:
      hpo_trials: 20
      hpo_space:
        lookback: [16, 64]
        max_epochs: [8, 20]

# -------------------------------------------------------
# Runtime inference source preference for specialist models
# -------------------------------------------------------
inference_preference:
  # True = try <specialist>_tcn first, then fallback to tree specialist.
  # False = try tree specialist first, then fallback to <specialist>_tcn.
  prefer_tcn_specialists: true
