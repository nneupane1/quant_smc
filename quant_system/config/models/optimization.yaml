optimization:
  bayesian:
    enabled: true
    sampler: "tpe"
    multivariate: false
    seed: 42
    pruner_startup_trials: 8
    pruner_warmup_steps: 0
    n_trials: 60
    timeout: 3600

  genetic:
    enabled: true
    # Keep this lean; trainer also applies hard caps to prevent runaway runtime.
    population_size: 6
    generations: 2
    crossover_rate: 0.6
    mutation_rate: 0.15
    seed: 42

  search_spaces:
    lightgbm:
      num_leaves: [32, 256]
      learning_rate: [0.001, 0.2]
      min_child_samples: [20, 200]
      feature_fraction: [0.6, 1.0]
    xgboost:
      max_depth: [3, 12]
      eta: [0.001, 0.2]
      subsample: [0.6, 1.0]
